# /etc/nginx/sites-available/sanad.conf — TLS via certbot
server {
    listen 443 ssl http2;
    server_name sanad.faezsports.com;

    # Twilio webhooks are small; keep bodies tight and rate-limit the public surface (SPEC §12)
    client_max_body_size 64k;
    limit_req zone=sanad_public burst=40 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
# in nginx.conf http {}: limit_req_zone $binary_remote_addr zone=sanad_public:10m rate=20r/s;
